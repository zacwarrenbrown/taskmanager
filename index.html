<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #dde1e7;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    .input-row input:focus { border-color: #4f46e5; }

    .input-row button {
      padding: 10px 18px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover { background: #4338ca; }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 5px 14px;
      border: 2px solid #dde1e7;
      background: #fff;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: #555;
      transition: all 0.15s;
    }

    .filter-btn.active {
      border-color: #4f46e5;
      background: #4f46e5;
      color: #fff;
    }

    .task-list { list-style: none; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: box-shadow 0.15s;
    }

    .task-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      color: #222;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .task-text-input {
      flex: 1;
      border: none;
      border-bottom: 2px solid #4f46e5;
      outline: none;
      font-size: 0.95rem;
      padding: 2px 4px;
      background: transparent;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: #aaa;
      font-size: 1rem;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover { color: #555; background: #f0f0f0; }
    .icon-btn.delete:hover { color: #ef4444; background: #fef2f2; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.95rem;
      padding: 32px 0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.82rem;
      color: #888;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 0.82rem;
      text-decoration: underline;
    }

    .clear-btn:hover { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task List</h1>

    <div class="input-row">
      <input id="new-task" type="text" placeholder="Add a new task..." maxlength="200">
      <button onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active')">Active</button>
      <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Done</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <div class="footer">
      <span id="count-label"></span>
      <button class="clear-btn" onclick="clearDone()">Clear completed</button>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';
    let editingId = null;

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('new-task');
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggleDone(id) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; save(); render(); }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function startEdit(id) {
      editingId = id;
      render();
      const input = document.getElementById('edit-' + id);
      if (input) { input.focus(); input.select(); }
    }

    function commitEdit(id) {
      const input = document.getElementById('edit-' + id);
      if (!input) return;
      const text = input.value.trim();
      if (text) {
        const t = tasks.find(t => t.id === id);
        if (t) t.text = text;
        save();
      }
      editingId = null;
      render();
    }

    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === f);
      });
      render();
    }

    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    function render() {
      const list = document.getElementById('task-list');
      const visible = tasks.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      if (visible.length === 0) {
        list.innerHTML = '<li class="empty">No tasks here.</li>';
      } else {
        list.innerHTML = visible.map(t => `
          <li class="task-item${t.done ? ' done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone(${t.id})">
            ${editingId === t.id
              ? `<input class="task-text-input" id="edit-${t.id}" value="${escHtml(t.text)}"
                   onblur="commitEdit(${t.id})"
                   onkeydown="if(event.key==='Enter')commitEdit(${t.id});if(event.key==='Escape'){editingId=null;render()}">`
              : `<span class="task-text">${escHtml(t.text)}</span>`
            }
            <button class="icon-btn" title="Edit" onclick="startEdit(${t.id})">&#9998;</button>
            <button class="icon-btn delete" title="Delete" onclick="deleteTask(${t.id})">&#10005;</button>
          </li>
        `).join('');
      }

      const active = tasks.filter(t => !t.done).length;
      document.getElementById('count-label').textContent =
        `${active} item${active !== 1 ? 's' : ''} left`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('new-task').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
